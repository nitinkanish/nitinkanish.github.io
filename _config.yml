# Online Calculators — Production Jekyll Calculator Website
# GitHub Pages compatible (no custom plugins required)

title: Online Calculators
tagline: Free Online Calculators for Everyone
description: >-
  Fast, accurate, and free online calculators for finance, health, math, business,
  and unit conversion. EMI, SIP, BMI, GST, percentage, and 1000+ more calculators.
url: "https://online-calculators.com"
baseurl: ""
lang: en
locale: en_US

# Google Analytics 4
google_analytics: G-BJLB2TWL8B

author:
  name: Nitin Kumar
  email: onlinecalculatorsinfo@gmail.com
  url: /about/

legal:
  operator: Nitin Kumar
  email: onlinecalculatorsinfo@gmail.com
  address: PMB 2010, Bel Air, CA 90049
  country: United States
  website: https://online-calculators.com

social:
  github: https://github.com/nitinkanish/nitinkanish.github.io
  linkedin: https://www.linkedin.com/company/onlinecalculators/

# GitHub Pages supported plugins
plugins:
  - jekyll-feed
  - jekyll-seo-tag

# jekyll-feed: only blog posts — not calculators or categories
feed:
  collections:
    posts:
      path: ""

# Collections
collections:
  calculators:
    output: true
    permalink: /:category/:name/
  categories:
    output: true
    permalink: /:name/

# Defaults
defaults:
  - scope:
      path: ""
      type: calculators
    values:
      layout: calculator
  - scope:
      path: ""
      type: categories
    values:
      layout: category
  - scope:
      path: "_posts"
      type: posts
    values:
      layout: post
      author: Online Calculators Team

# Markdown
markdown: kramdown
kramdown:
  input: GFM
  syntax_highlighter: rouge
  toc_levels: 2..4

# Sass
sass:
  style: compressed
  load_paths:
    - _sass

# Exclude from build
exclude:
  - Gemfile
  - Gemfile.lock
  - node_modules
  - vendor
  - scripts
  - README.md
  - DEPLOYMENT.md
  - .git
  - .gitignore

# Include
include:
  - _pages
  - robots.txt
  - llms.txt
  - llms-full.txt
  - manifest.json
  - sw.js
  - CNAME

# PWA
pwa:
  name: Online Calculators
  short_name: Calculators
  theme_color: "#5B5CF6"
  background_color: "#000000"

# Build settings
timezone: UTC
future: true
show_excerpts: true
paginate: 10
