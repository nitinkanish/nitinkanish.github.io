- slug: mortgage
  title: Mortgage Calculators
  icon: mortgage
  description: >-
    Calculate monthly mortgage payments, affordability, and amortization schedules
    for home loans and property financing.
  keywords:
    - mortgage calculator
    - home loan calculator
  faqs:
    - question: How is EMI calculated for a home loan?
      answer: >-
        EMI uses the formula EMI = P × r × (1+r)^n / ((1+r)^n - 1), where P is principal,
        r is monthly interest rate, and n is tenure in months.

- slug: health
  title: Health Calculators
  icon: health
  description: >-
    Track your wellness with BMI, BMR, calorie, pregnancy, and fitness calculators.
    Understand your body metrics and set achievable health goals.
  keywords:
    - health calculator
    - bmi calculator
    - fitness calculator
  faqs:
    - question: What is a healthy BMI range?
      answer: >-
        For adults, a BMI between 18.5 and 24.9 is generally considered healthy.
        BMI below 18.5 is underweight; 25–29.9 is overweight; 30+ is obese.
    - question: How accurate are calorie calculators?
      answer: >-
        Calorie estimates use established formulas (Mifflin-St Jeor) and provide
        a reliable baseline. Individual metabolism may vary.

