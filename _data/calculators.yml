  calculator_type: temperature-converter
  formula: "°F = (°C × 9/5) + 32; K = °C + 273.15"
  faqs:
    - question: How to convert Celsius to Fahrenheit?
      answer: Multiply Celsius by 9/5 and add 32. Formula — °F = (°C × 9/5) + 32.
    - question: How to convert Fahrenheit to Celsius?
      answer: Subtract 32 from Fahrenheit, then multiply by 5/9. Formula — °C = (°F - 32) × 5/9.
    - question: What is absolute zero?
      answer: Absolute zero is 0 Kelvin (-273.15°C or -459.67°F), the lowest possible temperature.
    - question: How to convert Celsius to Kelvin?
      answer: Add 273.15 to Celsius. K = °C + 273.15.
    - question: At what temperature are Celsius and Fahrenheit equal?
      answer: -40 degrees. -40°C = -40°F.
    - question: What is normal body temperature?
      answer: 37°C (98.6°F), though normal range is 36.1-37.2°C (97-99°F).
    - question: What is room temperature in Fahrenheit?
      answer: Room temperature is typically 20-22°C (68-72°F).
    - question: Why are there different temperature scales?
      answer: Celsius is based on water's freezing/boiling points. Fahrenheit uses a different reference. Kelvin is an absolute scale for science.
    - question: How to convert oven temperatures?
      answer: 180°C ≈ 350°F (moderate oven). 200°C ≈ 400°F (hot oven).
    - question: Is Kelvin used in everyday life?
      answer: Kelvin is primarily used in scientific and engineering applications, not everyday temperature measurement.

- title: Profit Margin Calculator
  slug: profit-margin-calculator
  category: business
  icon: profit
  description: Calculate gross, operating, and net profit margins for your business pricing strategy.
  keywords:
    - profit margin calculator
    - margin calculator
    - markup calculator
  popular: true
  date_added: 2025-03-05
  calculator_type: profit-margin
  formula: "Profit Margin = (Revenue - Cost) / Revenue × 100"
  faqs:
    - question: What is profit margin?
      answer: Profit margin is the percentage of revenue that remains as profit after deducting costs.
    - question: What is a good profit margin?
      answer: Varies by industry. 10-20% net margin is healthy for many businesses. Tech companies often have higher margins.
    - question: What is gross vs net profit margin?
      answer: Gross margin uses only COGS. Net margin accounts for all expenses including operating costs, taxes, and interest.
    - question: How to calculate markup vs margin?
      answer: Margin = (Price - Cost) / Price. Markup = (Price - Cost) / Cost. A 25% margin equals 33.3% markup.
    - question: How to improve profit margins?
      answer: Reduce costs, increase prices strategically, improve efficiency, and focus on high-margin products.
    - question: What is operating profit margin?
      answer: Operating margin = Operating Income / Revenue × 100, excluding taxes and interest.
    - question: Can profit margin exceed 100%?
      answer: Margin cannot exceed 100% (that would mean cost is negative). Markup can exceed 100%.
    - question: How does discounting affect margins?
      answer: Small discounts significantly reduce margins. A 10% price cut on 30% margin product reduces margin to about 18%.
    - question: What industries have highest margins?
      answer: Software, pharmaceuticals, luxury goods, and financial services typically have high profit margins.
    - question: Should I focus on margin or volume?
      answer: Balance both. High volume with thin margins can be profitable, but ensure cash flow covers operating costs.

- title: GST Calculator
  slug: gst-calculator
  category: business
  icon: gst
  description: Calculate GST inclusive and exclusive amounts for Indian tax rates of 5%, 12%, 18%, and 28%.
  keywords:
    - gst calculator
    - gst inclusive calculator
    - india gst calculator
  popular: true
  featured: true
  trending: true
  date_added: 2025-01-08
  calculator_type: gst
  formula: "GST Amount = Price × Rate / 100; Inclusive Price = Price × (1 + Rate/100)"
  faqs:
    - question: What is GST?
      answer: GST (Goods and Services Tax) is an indirect tax levied on supply of goods and services in India.
    - question: What are GST rates in India?
      answer: Standard rates are 5%, 12%, 18%, and 28%. Some items are exempt or taxed at 0.25% or 3%.
    - question: How to calculate GST exclusive amount?
      answer: GST Amount = Base Price × GST Rate / 100. Total = Base Price + GST Amount.
    - question: How to calculate GST from inclusive price?
      answer: Base Price = Inclusive Price / (1 + GST Rate/100). GST = Inclusive Price - Base Price.
    - question: What is CGST and SGST?
      answer: For intra-state sales, GST is split equally into CGST (Central) and SGST (State). Inter-state uses IGST.
    - question: Who needs to register for GST?
      answer: Businesses with annual turnover exceeding ₹20 lakh (₹10 lakh for special category states) must register.
    - question: What is input tax credit?
      answer: ITC allows businesses to claim credit for GST paid on purchases against GST collected on sales.
    - question: Is GST applicable on exports?
      answer: Exports are zero-rated. Exporters can claim refund on input taxes paid.
    - question: How to calculate reverse GST?
      answer: To extract GST from inclusive price — divide by (1 + rate/100). Example — ₹118 inclusive at 18% = ₹118/1.18 = ₹100 base.
    - question: What items are GST exempt?
      answer: Fresh fruits, vegetables, milk, bread, educational services, and healthcare are among exempt categories.
