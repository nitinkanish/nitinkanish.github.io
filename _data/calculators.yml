      answer: Total Daily Energy Expenditure is the total calories you burn including all daily activities and exercise.
    - question: How many calories for weight loss?
      answer: A deficit of 500 calories per day typically results in about 0.5 kg (1 lb) weight loss per week.
    - question: How many calories for muscle gain?
