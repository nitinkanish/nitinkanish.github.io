  faqs:
    - question: How is my due date calculated?
      answer: From your last menstrual period (LMP), due date is typically LMP + 280 days (40 weeks). From conception, due date is conception + 266 days.
    - question: What is Naegele's rule?
      answer: Add 1 year, subtract 3 months, and add 7 days to the first day of your LMP. This equals approximately 280 days from LMP.
    - question: How accurate is a due date calculator?
      answer: Only about 5% of babies are born on the exact due date. Most arrive within two weeks before or after. Ultrasound dating is more precise in early pregnancy.
    - question: What trimester am I in?
      answer: First trimester is weeks 1–12, second is weeks 13–27, and third is weeks 28 until delivery.
    - question: Can I use conception date instead of LMP?
      answer: Yes. Select conception date mode — we add 266 days (38 weeks) to estimate your due date.
    - question: Does cycle length affect due date?
      answer: Yes. If your cycle is longer or shorter than 28 days, we adjust the due date accordingly.
    - question: When should I see a doctor?
      answer: Schedule a prenatal visit as soon as you know you're pregnant. This calculator is informational only — not medical advice.
    - question: What if I had IVF?
      answer: IVF due dates are set by your clinic based on embryo transfer date. Use conception/transfer date mode with guidance from your provider.
    - question: How many weeks pregnant am I?
      answer: Gestational age is counted from the first day of your LMP — the same start point used for due date calculation.
    - question: Is this calculator a substitute for ultrasound?
      answer: No. Early ultrasound (dating scan) is the most accurate method. Always follow your healthcare provider's assessment.

