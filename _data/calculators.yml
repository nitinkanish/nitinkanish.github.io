      answer: 1 stone = 6.35029 kilograms. Multiply stones by 6.35029.
    - question: What is the difference between mass and weight?
      answer: Mass (kg) is the amount of matter. Weight is the force of gravity on mass. They're used interchangeably in everyday contexts.
    - question: How many ounces in a pound?
      answer: 1 pound = 16 ounces.
    - question: How to convert body weight from lbs to kg?
      answer: Divide pounds by 2.20462 or multiply by 0.453592.
    - question: What is a metric ton?
      answer: 1 metric ton (tonne) = 1,000 kilograms.
    - question: How many pounds in a stone?
      answer: 1 stone = 14 pounds.
    - question: Are US and UK tons different?
      answer: Yes. US ton = 2,000 lbs. UK (long) ton = 2,240 lbs. Metric tonne = 2,204.62 lbs.
    - question: How precise are weight conversions?
      answer: We use standard conversion factors accurate to 6 decimal places.

