  faqs:
    - question: How do I simplify a ratio?
      answer: Divide both parts by their greatest common divisor. 12:8 simplifies to 3:2.
    - question: How do I find a missing value in a proportion?
      answer: Use cross-multiplication. If 3:5 = x:20, then x = (3 × 20) / 5 = 12.
    - question: What is the difference between ratio and proportion?
      answer: A ratio compares two quantities (3:2). A proportion states two ratios are equal (3:2 = 6:4).
    - question: Can ratios include decimals?
      answer: Yes, but it is often clearer to convert to whole numbers first by multiplying both parts by a power of 10.
    - question: How do I scale a ratio?
      answer: Multiply or divide both parts by the same factor. 2:3 scaled by 4 becomes 8:12.
    - question: Is order important in a ratio?
      answer: Yes. 3:5 is not the same as 5:3. Always match the order to your problem context.

