  popular: true
  featured: true
  date_added: 2025-06-25
  calculator_type: fraction
  formula: "a/b ± c/d with common denominator; result simplified via GCD"
  faqs:
    - question: How do I add fractions with different denominators?
      answer: Find the least common denominator (LCD), convert both fractions, then add numerators. Example — 1/3 + 1/4 = 4/12 + 3/12 = 7/12.
    - question: How do I simplify a fraction?
      answer: Divide numerator and denominator by their greatest common divisor (GCD). 8/12 simplifies to 2/3.
    - question: Can I multiply fractions directly?
      answer: Yes. Multiply numerators together and denominators together, then simplify. 2/3 × 3/4 = 6/12 = 1/2.
    - question: How do I divide fractions?
      answer: Multiply by the reciprocal of the divisor. 3/4 ÷ 1/2 = 3/4 × 2/1 = 6/4 = 3/2.
    - question: What is an improper fraction?
      answer: A fraction where the numerator is greater than or equal to the denominator, like 7/4. It equals 1 3/4 as a mixed number.
    - question: How do I convert a fraction to a decimal?
      answer: Divide the numerator by the denominator. 3/8 = 0.375.

