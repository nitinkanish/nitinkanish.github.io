    - india gst calculator
  popular: true
  featured: true
  trending: true
  date_added: 2025-01-08
  calculator_type: gst
  formula: "GST Amount = Price × Rate / 100; Inclusive Price = Price × (1 + Rate/100)"
  faqs:
    - question: What is GST?
      answer: GST (Goods and Services Tax) is an indirect tax levied on supply of goods and services in India.
    - question: What are GST rates in India?
      answer: Standard rates are 5%, 12%, 18%, and 28%. Some items are exempt or taxed at 0.25% or 3%.
    - question: How to calculate GST exclusive amount?
      answer: GST Amount = Base Price × GST Rate / 100. Total = Base Price + GST Amount.
    - question: How to calculate GST from inclusive price?
      answer: Base Price = Inclusive Price / (1 + GST Rate/100). GST = Inclusive Price - Base Price.
    - question: What is CGST and SGST?
      answer: For intra-state sales, GST is split equally into CGST (Central) and SGST (State). Inter-state uses IGST.
    - question: Who needs to register for GST?
      answer: Businesses with annual turnover exceeding ₹20 lakh (₹10 lakh for special category states) must register.
    - question: What is input tax credit?
      answer: ITC allows businesses to claim credit for GST paid on purchases against GST collected on sales.
    - question: Is GST applicable on exports?
      answer: Exports are zero-rated. Exporters can claim refund on input taxes paid.
    - question: How to calculate reverse GST?
      answer: To extract GST from inclusive price — divide by (1 + rate/100). Example — ₹118 inclusive at 18% = ₹118/1.18 = ₹100 base.
    - question: What items are GST exempt?
      answer: Fresh fruits, vegetables, milk, bread, educational services, and healthcare are among exempt categories.

