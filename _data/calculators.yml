  date_added: 2025-06-25
  calculator_type: rounding
  formula: "Round(n, d) = round n to d decimal places"
  faqs:
    - question: How do I round to 2 decimal places?
      answer: Look at the third decimal digit. If it is 5 or greater, round up. 3.456 rounds to 3.46.
    - question: What is the difference between round and truncate?
      answer: Round considers the next digit for adjustment. Truncate simply cuts off digits without changing the value. truncate(3.99, 1) = 3.9, round(3.99, 1) = 4.0.
    - question: What does floor do?
      answer: Floor always rounds down to the nearest value at the specified precision. floor(3.99, 0) = 3.
    - question: What does ceil do?
      answer: Ceil always rounds up. ceil(3.01, 0) = 4.
    - question: How do bankers round?
      answer: Standard rounding (round half up) is used here. 2.5 rounds to 3, 3.5 rounds to 4.
    - question: Can I round currency amounts?
      answer: Yes. Set decimal places to 2 for cents/paise rounding on any monetary value.

