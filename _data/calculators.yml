      answer: The square root of n is a number that multiplied by itself equals n. √25 = 5 because 5 × 5 = 25.
    - question: What is a perfect square?
      answer: A number whose square root is a whole number. Examples include 1, 4, 9, 16, 25, 36, 49, 64, 81, 100.
    - question: Can I calculate square roots of negative numbers?
      answer: Real square roots of negative numbers are undefined. This calculator works with non-negative inputs.
