  faqs:
    - question: What is markup?
      answer: Markup is the percentage added to cost to get selling price. 50% markup on ₹100 cost = ₹150 price.
    - question: Markup vs margin — what's the difference?
      answer: Markup is profit divided by cost. Margin is profit divided by selling price. They are not the same number.
    - question: How do I calculate selling price?
      answer: Selling Price = Cost × (1 + Markup/100). Or Cost + (Cost × Markup%).
    - question: What is a good markup percentage?
      answer: Varies by industry — retail 50–100%, restaurants 200–400% on food, wholesale 10–20%.
    - question: Can I work backwards from selling price?
      answer: This calculator adds markup to cost. For margin-based pricing, use our Profit Margin Calculator.
    - question: Does this include tax?
      answer: No. Add GST or sales tax separately based on your jurisdiction.
