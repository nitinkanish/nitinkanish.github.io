    - question: How do I convert km/h to mph?
      answer: Multiply km/h by 0.621371. Example — 100 km/h ≈ 62.14 mph.
    - question: What is a knot?
      answer: One knot = one nautical mile per hour ≈ 1.852 km/h. Used in aviation and maritime navigation.
    - question: How do I convert mph to m/s?
      answer: Multiply mph by 0.44704. Useful for physics and engineering calculations.
    - question: Which units are supported?
      answer: km/h, mph, m/s, knots, and ft/s with instant bidirectional conversion.
    - question: Are conversions exact?
      answer: We use standard international conversion factors accurate to six decimal places.
    - question: Can I swap units?
      answer: Yes. Use the swap button to reverse source and target units.

