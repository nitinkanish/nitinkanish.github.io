emi-calculator:
  trust_badge: "Trusted by 80,000+ home loan borrowers"
  usage_stat: "30K+ EMI calculations this month"
  hero_badge: "EMI"
  widget:
    input_title: "Loan Details"
    input_subtitle: "Adjust amount, rate, and tenure to see your EMI instantly"
    results_title: "Live EMI Breakdown"
    primary_label: "Monthly EMI"
    metric_1_label: "Principal Amount"
    metric_2_label: "Total Interest"
    metric_3_label: "Total Payment"
  timeline:
    title: "Loan Repayment Journey"
    lead: "See how your loan balance reduces over time."
  chart:
    title: "Amortization Overview"
    tabs: ["Balance", "Principal Paid", "Interest Paid"]
  goals:
    - { emoji: "🏠", label: "Dream Home", target: 5000000, years: 20 }
    - { emoji: "🚗", label: "Car Loan", target: 1500000, years: 5 }
    - { emoji: "🎓", label: "Education", target: 2000000, years: 10 }
  compare:
    title: "How Does Your EMI Compare?"
    lead: "See how your loan stacks up against typical borrowers."
    cards:
      - { label: "Average Home Loan", value: "₹35,000/mo", sub: "₹45L · 20 yrs · 8.5%" }
      - { label: "Your EMI", value_id: "compare-you", sub: "Based on your inputs", highlight: true }
      - { label: "Lower Rate (7.5%)", value: "₹31,200/mo", sub: "Same loan, better rate" }
  share:
    title: "Share Your EMI Plan"
    card_heading: "My Loan EMI Plan"
  examples:
    - { label: "Home Loan", desc: "₹50L · 8.5% · 20 yrs", data: { principal: 5000000, rate: 8.5, tenure: 240 } }
    - { label: "Car Loan", desc: "₹8L · 9% · 5 yrs", data: { principal: 800000, rate: 9, tenure: 60 } }
    - { label: "Personal Loan", desc: "₹3L · 12% · 3 yrs", data: { principal: 300000, rate: 12, tenure: 36 } }
  community:
    - { story: "Reduced tenure by 3 years with annual prepayments.", result: "Saved ₹4.2L in interest", likes: 312, comments: 48 }
    - { story: "Compared 5 banks before finalizing home loan.", result: "0.4% lower rate = ₹2.8L saved", likes: 445, comments: 62 }
  newsletter: { title: "Smart Borrowing Tips", text: "Weekly guides on loans, rates, and prepayment strategies." }
  formula_vars: ["P — Principal loan amount", "r — Monthly interest rate (annual ÷ 12)", "n — Tenure in months"]
  sticky_label: "Monthly EMI"

