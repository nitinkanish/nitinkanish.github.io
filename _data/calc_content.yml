      description: "Imperial to metric height conversion"
      result: "1.524 meters"
    - title: "100 cm to inches"
      description: "Metric to imperial"
      result: "39.37 inches"
  intro: |
    The **Length Converter** instantly converts between metric and imperial length units — meters, kilometers, centimeters, millimeters, feet, inches, yards, and miles. Essential for international travel, engineering, construction, fitness tracking, and education.

    ## Standard Conversion Factors

    Conversions flow through the **meter** as the SI base unit: 1 foot = 0.3048 m (exact), 1 inch = 2.54 cm (exact), 1 mile = 1.609344 km. Our tool uses internationally standardized factors for accuracy up to six decimal places.

    ## Popular Conversions

    Height: feet/inches ↔ centimeters (common for medical and sports records). Distance: miles ↔ kilometers for running and driving. Construction: feet ↔ meters on international projects. Fabric and manufacturing: inches ↔ millimeters.

    ## Tips

    Use the swap button to reverse conversion direction instantly. For height in feet and inches format (5'10"), convert total inches first: (5 × 12) + 10 = 70 inches, then convert to cm.

