      result: "8:12"
  intro: |
    The **Ratio Calculator** simplifies ratios to their lowest terms and solves proportion problems using cross-multiplication. Use it for recipe adjustments, map scales, financial ratios, and any situation where proportional relationships matter.

    ## Simplifying Ratios

    Divide both parts of a ratio by their GCD. The ratio 12:8 becomes 3:2. Order matters — 3:2 is not the same as 2:3.

    ## Proportions

    If a:b = c:d, then a × d = b × c. Enter three known values to find the fourth. This is essential for scaling recipes, mixing solutions, and solving word problems. Related tools: [Fraction Calculator](/math/fraction-calculator/) for fractional quantities, [Percentage Calculator](/math/percentage-calculator/) for percent-based ratios, and [Markup Calculator](/business/markup-calculator/) for cost-to-price ratios.
