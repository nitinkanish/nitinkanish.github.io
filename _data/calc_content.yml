      result: "89 days (90 inclusive)"
    - title: "Project Sprint"
      description: "90-day development cycle"
      result: "12 weeks and 6 days"
  intro: |
    The **Date Difference Calculator** computes the exact time span between any two calendar dates — in days, weeks, months, and years. Perfect for contract deadlines, rental periods, project planning, event countdowns, and legal date calculations.

    ## How Date Math Works

    We calculate the difference using calendar dates, correctly handling varying month lengths and leap years. The breakdown shows whole years, months, and remaining days for an intuitive reading alongside the total day count.

    ## Inclusive vs Exclusive Counting

    By default, we count the span between dates (exclusive of the end date in the day count sense). Enable **include end date** to add one day — useful when both the start and end dates should count (e.g., a 7-day rental from Monday to Sunday inclusive).

    ## Common Use Cases

    Calculate days until a deadline, determine employment tenure, measure project duration, count days in a billing period, verify age eligibility between dates, and plan event timelines. For birth-date age calculation, see our dedicated Age Calculator.

macro-calculator:
  steps:
    - "Enter your body weight in kilograms."
    - "Set your daily calorie target (from TDEE or diet plan)."
    - "Choose your goal — fat loss, maintain, or muscle gain."
    - "View daily protein, carbohydrate, and fat gram targets."
  examples:
    - title: "Cutting Phase"
      description: "75 kg · 2,000 calories · fat loss goal"
      result: "High protein split with moderate fat"
    - title: "Muscle Building"
      description: "80 kg · 2,800 calories · gain goal"
      result: "Higher carbs for training fuel"
  intro: |
    The **Macro Calculator** distributes your daily calories across **protein**, **carbohydrates**, and **fat** based on your body weight and fitness goal. Macronutrient tracking (IIFYM — If It Fits Your Macros) is a flexible approach to nutrition that prioritizes hitting gram targets within your calorie budget.

    ## How Macros Are Calculated

    Protein is set based on body weight (default 1.8 g per kg — adjustable). Fat percentage varies by goal: 25% for fat loss, 30% for maintenance, 20% for muscle gain. Remaining calories go to carbohydrates. Protein and carbs provide 4 calories per gram; fat provides 9 calories per gram.

    ## Why Macros Matter

    Total calories determine weight change, but macro balance affects **muscle retention**, energy levels, satiety, and athletic performance. Adequate protein during a deficit helps preserve lean mass. Sufficient carbs support intense training. Healthy fats support hormones and nutrient absorption.

    ## Getting Started

    Use our BMR or Calorie Calculator first to estimate your TDEE, then plug that number here. Track macros with a food scale and nutrition app. Adjust after 2–4 weeks based on scale weight, energy, and gym performance.

gpa-calculator:
  steps:
    - "Enter the letter grade for each course (A through F)."
    - "Enter credit hours for each course."
    - "Leave credits at 0 for courses not taken this term."
    - "View your weighted GPA on the 4.0 scale."
  examples:
    - title: "Typical Semester"
      description: "4 courses with mixed grades"
      result: "GPA ≈ 3.45 on 13 credit hours"
  intro: |
    The **GPA Calculator** computes your **Grade Point Average** on the standard US 4.0 scale by weighting each course grade by its credit hours. Essential for students tracking academic progress, applying to graduate programs, or maintaining scholarship requirements.

    ## GPA Formula

    GPA = Σ(Grade Points × Credit Hours) ÷ Σ(Credit Hours). An A (4.0) in a 4-credit course contributes 16.0 points. A B (3.0) in a 3-credit course contributes 9.0 points. The sum is divided by total credits attempted.

    ## Standard Grade Scale

    A = 4.0, A− = 3.7, B+ = 3.3, B = 3.0, B− = 2.7, C+ = 2.3, C = 2.0, D = 1.0, F = 0.0. Some schools use plus/minus grading; others use whole letters only. This calculator supports the common plus/minus scale.

    ## Tips for Raising GPA

    Strong grades in **high-credit courses** have the biggest impact. Replacing a C in a 4-credit class with a B moves GPA more than improving a 1-credit lab. Model scenarios by changing grades above to see what you need for your target GPA.

area-calculator:
  steps:
    - "Select shape — rectangle, circle, or triangle."
    - "Enter dimensions in feet or meters."
    - "View area in square feet and square meters."
    - "Use the waste factor tip for material ordering."
  examples:
