    - "Use insights to detect skewed data."
  intro: |
    The **Mean Median Mode Calculator** computes the three measures of **central tendency** plus range and count. Essential for statistics homework, survey analysis, and understanding data distributions.

    ## When to Use Each Measure

    **Mean** for symmetric data. **Median** when outliers exist. **Mode** for categorical or most-common values.

heart-rate-zone-calculator:
