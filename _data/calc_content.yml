    - "Enter the exponent (positive, negative, or decimal)."
    - "View the result instantly."
  examples:
    - title: "2^10"
      description: "Power of 2"
      result: "1024"
    - title: "5^(-2)"
      description: "Negative exponent"
      result: "0.04"
    - title: "9^0.5"
      description: "Fractional exponent (square root)"
      result: "3"
  intro: |
    The **Exponent Calculator** computes base raised to any exponent — positive integers, negative powers, and decimal exponents. Essential for scientific notation, compound growth, computer science (binary powers), and algebra.

    ## Exponent Rules

    **Negative exponents:** b⁻ⁿ = 1/bⁿ. **Zero exponent:** b⁰ = 1 (for b ≠ 0). **Fractional exponents:** b^(1/n) = ⁿ√b. **Product rule:** bᵐ × bⁿ = b^(m+n).

    ## Related Calculators

    For square roots specifically, use the [Square Root Calculator](/math/square-root-calculator/). For compound growth over time, see [Compound Interest Calculator](/finance/compound-interest-calculator/). For percentage-based growth, use the [Percentage Calculator](/math/percentage-calculator/).
