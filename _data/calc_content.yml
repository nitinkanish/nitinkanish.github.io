  intro: |
    The **Love Calculator** is a fun, name-based compatibility tool that gives you a playful love percentage between two names. It is designed for entertainment and curiosity, not scientific relationship prediction.

    ## How It Works

    We normalize both names, compare shared letters, check sequence similarity, and add a deterministic pattern score to generate a value from 0 to 100. The same names always return the same result.

    ## Score Bands

    **75–100:** Strong match and high playful compatibility.
    **60–74:** Warm match with good balance.
    **25–59:** Mixed match with room to grow.
    **0–24:** Low match — keep it light and fun.

    ## Important Note

    This calculator is for entertainment purposes only. Real relationships are built on trust, communication, respect, and shared values — not just name matching.
