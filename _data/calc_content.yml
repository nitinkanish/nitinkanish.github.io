  intro: |
    The **Area Calculator** computes surface area for **rectangles**, **circles**, and **triangles** — the most common shapes in construction, flooring, landscaping, and interior design. Enter dimensions in feet or meters and get instant results in both square feet and square meters.

    ## Area Formulas

    **Rectangle:** Area = length × width. **Circle:** Area = π × radius². **Triangle:** Area = ½ × base × height. For irregular rooms, divide the space into rectangles and sum the areas.

    ## Material Estimation Tips

    When ordering flooring, tile, carpet, or paint, add a **5–10% waste factor** for cuts, pattern matching, and mistakes. Complex layouts with many angles may need 15% extra. Always verify measurements on-site before purchasing materials.

    ## Unit Conversions

    1 square foot = 0.0929 square meters. 1 square meter = 10.7639 square feet. Our calculator shows both automatically regardless of which unit you enter dimensions in.

standard-deviation-calculator:
  steps:
    - "Enter your data values separated by commas, spaces, or new lines."
    - "Choose sample (n−1) or population (N) calculation."
    - "View mean, variance, standard deviation, and range."
    - "Use insights for data interpretation."
  examples:
    - title: "Test Scores"
      description: "8 student exam scores"
      result: "Mean ≈ 21.25 · SD ≈ 5.8 (sample)"
  intro: |
    The **Standard Deviation Calculator** measures how spread out your data is from the mean — a fundamental statistic in science, finance, quality control, and education. Enter any dataset and instantly compute mean, variance, and standard deviation.

    ## Sample vs Population

    Use **sample** standard deviation (dividing by n−1) when your data is a subset of a larger population — common in surveys and experiments. Use **population** standard deviation (dividing by N) when you have complete data for the entire group.

    ## Interpreting Results

    A low standard deviation means data points cluster close to the mean. A high standard deviation indicates wide spread. In a normal distribution, roughly 68% of values fall within one SD of the mean, 95% within two SDs, and 99.7% within three SDs.

    ## Practical Applications

    Analyze test score distributions, measure investment volatility, monitor manufacturing quality control, evaluate experimental results, and complete statistics homework. Pair with our other math tools for comprehensive data analysis.

loan-payoff-calculator:
  steps:
    - "Enter your loan principal, interest rate, and original tenure."
    - "Add your planned extra monthly payment amount."
    - "View months saved and total interest saved."
    - "Compare original vs accelerated payoff timeline."
  intro: |
    The **Loan Payoff Calculator** shows how extra EMI or prepayment reduces your loan tenure and total interest. Whether you have a home loan, car loan, or personal loan, even modest extra payments can save lakhs over the loan life.

    ## How Prepayment Works

    Extra payments go directly toward principal, reducing the balance on which interest is calculated. The effect compounds — each month you owe less interest, so more of your regular EMI attacks principal.

    ## Indian Home Loans

    Most Indian banks allow partial prepayment on floating-rate home loans without penalty. Use this tool to model ₹2,000, ₹5,000, or ₹10,000 extra per month and see your new payoff date.

mortgage-affordability-calculator:
  steps:
    - "Enter annual gross household income."
    - "Add monthly debt payments (car, student loans, etc.)."
    - "Set down payment percentage and mortgage rate."
    - "View maximum affordable home price and monthly payment."
  intro: |
    The **Mortgage Affordability Calculator** estimates how much house you can buy using the industry-standard **28/36 rule** — housing costs up to 28% of gross monthly income and total debt up to 36%.

    ## Understanding the 28/36 Rule

    Lenders use these ratios to qualify borrowers. The 28% covers principal and interest (PITI). The 36% includes all monthly debt obligations. Staying within these limits improves approval odds and financial stability.

    ## Beyond the Calculator

    Remember to budget for property taxes, homeowner's insurance, HOA fees, maintenance, and closing costs. A pre-approval from your lender provides the most accurate affordability figure.

volume-calculator:
  steps:
