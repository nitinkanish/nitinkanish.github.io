age-calculator:
  steps:
    - "Enter your date of birth."
    - "Optionally set an end date (defaults to today)."
    - "View exact age in years, months, and days."
    - "See total days lived and next birthday countdown."
  examples:
    - title: "Born January 15, 1990"
      description: "Age calculated as of today"
      result: "35+ years with exact months and days"
  intro: |
    The **Age Calculator** computes your exact age down to years, months, and days — useful for official forms, eligibility checks, milestone celebrations, and curiosity. Unlike mental math, it correctly handles leap years and varying month lengths.

    ## How Exact Age Is Calculated

    Age is the difference between two dates, accounting for whether the current day has passed the birth day in the current month. If not, we borrow days from the previous month. Leap years add an extra day in February every four years (with century exceptions).

    ## Common Use Cases

    Verify eligibility for school admission, government schemes, insurance policies, retirement benefits, driving licenses, and sports age categories. Calculate how many days until a milestone birthday. Determine tenure for employment or membership duration between any two dates.

    ## International Age Systems

    This calculator uses **international age** (age at last birthday). Some cultures use East Asian traditional counting where a person is 1 at birth. For legal purposes, always confirm which system your jurisdiction requires.

scientific-calculator:
  steps:
    - "Use on-screen buttons or your keyboard to enter expressions."
    - "Toggle DEG/RAD mode for trigonometric functions."
    - "Apply functions like sin, cos, tan, log, sqrt, and powers."
    - "Press equals or Enter to compute the result."
  examples:
    - title: "sin(30°)"
      description: "Trigonometry in degree mode"
      result: "0.5"
    - title: "√144 + 2³"
      description: "Combined operations"
      result: "20"
  intro: |
    Our **free online Scientific Calculator** provides advanced mathematical functions beyond basic arithmetic — trigonometry, logarithms, exponentials, powers, roots, and constants π and e. Ideal for students, engineers, and professionals who need quick calculations without installing software.

    ## Supported Functions

    Trigonometric: sin, cos, tan (with degree/radian toggle). Logarithmic: log (base 10), ln (natural log). Power operations: x², x^y, √x. Additional: factorial, reciprocal, negation, and constants π ≈ 3.14159 and e ≈ 2.71828.

    ## Keyboard Shortcuts

    Type numbers and operators directly. Press **Enter** to calculate, **Escape** to clear, and **Backspace** to delete the last digit. Keyboard input makes extended calculations faster than clicking alone.

    ## Precision and Limitations

    Results use IEEE 754 double-precision floating point (~15 significant digits). For extremely large numbers, results may display in scientific notation. This tool is excellent for homework and professional estimates but verify critical engineering calculations independently.

length-converter:
  steps:
    - "Enter the value you want to convert."
    - "Select the source unit (e.g., feet, meters, inches)."
    - "Select the target unit."
    - "View the converted result and equivalent in meters."
  examples:
    - title: "5 feet to meters"
      description: "Imperial to metric height conversion"
      result: "1.524 meters"
    - title: "100 cm to inches"
      description: "Metric to imperial"
      result: "39.37 inches"
  intro: |
    The **Length Converter** instantly converts between metric and imperial length units — meters, kilometers, centimeters, millimeters, feet, inches, yards, and miles. Essential for international travel, engineering, construction, fitness tracking, and education.

    ## Standard Conversion Factors

    Conversions flow through the **meter** as the SI base unit: 1 foot = 0.3048 m (exact), 1 inch = 2.54 cm (exact), 1 mile = 1.609344 km. Our tool uses internationally standardized factors for accuracy up to six decimal places.

    ## Popular Conversions

    Height: feet/inches ↔ centimeters (common for medical and sports records). Distance: miles ↔ kilometers for running and driving. Construction: feet ↔ meters on international projects. Fabric and manufacturing: inches ↔ millimeters.

    ## Tips

    Use the swap button to reverse conversion direction instantly. For height in feet and inches format (5'10"), convert total inches first: (5 × 12) + 10 = 70 inches, then convert to cm.

weight-converter:
  steps:
    - "Enter the weight value to convert."
    - "Choose the source unit (kg, lb, oz, etc.)."
    - "Choose the target unit."
    - "View converted weight and kilogram equivalent."
  examples:
    - title: "70 kg to pounds"
      description: "Body weight conversion"
      result: "154.32 lbs"
    - title: "1 stone to kg"
      description: "UK weight unit"
      result: "6.35 kg"
  intro: |
    The **Weight Converter** converts between kilograms, pounds, ounces, grams, milligrams, stones, and metric tons. Whether tracking body weight, shipping packages, cooking, or scientific work, accurate unit conversion prevents costly errors.

    ## Key Conversion Factors

    1 kilogram = 2.20462 pounds. 1 pound = 16 ounces. 1 stone = 14 pounds = 6.35029 kg. 1 metric ton = 1,000 kg. Conversions route through kilograms as the base SI unit for consistency.

    ## Mass vs Weight

    In everyday language we say "weight" when we mean **mass**. Scientifically, weight is force (mass × gravity) measured in newtons. Kitchen scales and bathroom scales measure mass. This converter handles mass units used globally in commerce and daily life.

    ## Common Applications

    Convert body weight between kg and lbs for international health records. Convert recipe ingredients between ounces and grams. Calculate shipping weights for e-commerce. Convert gym plate weights between pound and kilogram denominations.

temperature-converter:
  steps:
    - "Enter the temperature value."
    - "Select source scale (Celsius, Fahrenheit, or Kelvin)."
    - "Select target scale."
    - "View converted value in all three scales."
  examples:
    - title: "25°C to Fahrenheit"
      description: "Room temperature conversion"
      result: "77°F"
    - title: "98.6°F to Celsius"
      description: "Body temperature"
      result: "37°C"
  intro: |
    The **Temperature Converter** converts between **Celsius (°C)**, **Fahrenheit (°F)**, and **Kelvin (K)** — the three scales used in science, medicine, cooking, and weather. Instant, accurate conversion without memorizing formulas.

    ## Conversion Formulas

    **Celsius to Fahrenheit:** °F = (°C × 9/5) + 32. **Fahrenheit to Celsius:** °C = (°F − 32) × 5/9. **Celsius to Kelvin:** K = °C + 273.15. Kelvin is an absolute scale starting at absolute zero (−273.15°C), used in physics and chemistry.

    ## Reference Points

    Water freezes at 0°C (32°F) and boils at 100°C (212°F) at sea level. Normal body temperature is approximately 37°C (98.6°F). Room temperature is roughly 20–22°C (68–72°F). Celsius and Fahrenheit intersect at −40°.

    ## Practical Uses

    Convert oven temperatures for international recipes (180°C ≈ 350°F). Interpret weather forecasts when traveling abroad. Convert laboratory measurements. Understand medical thermometers using different scales.

profit-margin-calculator:
  steps:
    - "Enter revenue (selling price or total sales)."
    - "Enter cost price (COGS or production cost)."
    - "View profit margin %, markup %, and gross profit amount."
    - "Compare against industry benchmarks in insights."
  examples:
    - title: "Sell ₹1,000 · Cost ₹700"
      description: "Retail product margin"
      result: "30% margin · 42.9% markup · ₹300 profit"
  intro: |
    The **Profit Margin Calculator** helps businesses and entrepreneurs understand profitability by calculating **gross profit margin**, **markup percentage**, and absolute profit from revenue and cost inputs. Essential for pricing strategy, financial reporting, and investor presentations.

    ## Margin vs Markup

    **Profit margin** = (Revenue − Cost) / Revenue × 100. **Markup** = (Revenue − Cost) / Cost × 100. These differ significantly: a 25% margin equals a 33.3% markup. Confusing them leads to underpricing and eroded profits.

    ## Industry Benchmarks

    Retail typically targets 25–35% gross margin. Restaurants operate on thin 3–9% net margins. SaaS companies often achieve 70–80% gross margins. Manufacturing varies widely by sector. Compare your margins to industry standards, not arbitrary targets.

    ## Improving Margins

    Reduce cost of goods through supplier negotiation or efficiency gains. Increase prices strategically where demand is inelastic. Eliminate low-margin products. Improve operational efficiency to reduce overhead. Even a 2% margin improvement can significantly impact annual profit at scale.

pregnancy-calculator:
  steps:
    - "Choose calculation method — Last Menstrual Period (LMP) or conception date."
    - "Enter the first day of your last period or conception date."
    - "Adjust cycle length if different from 28 days (LMP method only)."
    - "View due date, gestational age in weeks and days, trimester, and days remaining."
  examples:
    - title: "12 Weeks Pregnant"
      description: "LMP approximately 12 weeks ago"
      result: "Gestational age ≈ 12 weeks, 0 days · Second trimester approaching"
    - title: "Conception Date Known"
      description: "Conception date entered directly"
      result: "Due date = conception + 266 days"
  intro: |
    The **Pregnancy Due Date Calculator** estimates your expected delivery date and current gestational age using standard obstetric formulas. Whether you know your last menstrual period (LMP) or conception date, this tool provides an instant timeline for planning prenatal care and tracking milestones.

    ## How Due Dates Are Calculated

    The most common method is **Naegele's rule**: add 280 days (40 weeks) to the first day of your last menstrual period. If your menstrual cycle is longer or shorter than 28 days, we adjust accordingly. When using **conception date**, we add 266 days (38 weeks) since gestational age is counted from LMP, approximately two weeks before conception.

    ## Understanding Gestational Age

    Gestational age is expressed in **weeks and days** — for example, "12 weeks, 3 days" means you are in your 13th week of pregnancy. The first trimester spans weeks 1–12, the second trimester weeks 13–27, and the third trimester weeks 28 until delivery.

    ## Important Medical Disclaimer

    Only about 5% of babies are born on the exact due date. Early ultrasound dating (dating scan at 8–12 weeks) is more accurate than LMP alone. This calculator is for informational purposes — always follow guidance from your obstetrician, midwife, or healthcare provider for prenatal care and delivery planning.

