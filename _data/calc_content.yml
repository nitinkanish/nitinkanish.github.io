    The **Grade Calculator** computes your **weighted course grade** from assignment categories with different weights. Essential for tracking progress mid-semester and calculating what you need on the final exam.

    ## Weighted Grade Formula

    Grade = (Score₁ × Weight₁ + Score₂ × Weight₂ + ...) / Total Weight. Weights should sum to 100% for a complete course breakdown.

mean-median-mode-calculator:
  steps:
