      description: "Body weight conversion"
      result: "154.32 lbs"
    - title: "1 stone to kg"
      description: "UK weight unit"
      result: "6.35 kg"
  intro: |
    The **Weight Converter** converts between kilograms, pounds, ounces, grams, milligrams, stones, and metric tons. Whether tracking body weight, shipping packages, cooking, or scientific work, accurate unit conversion prevents costly errors.

    ## Key Conversion Factors

    1 kilogram = 2.20462 pounds. 1 pound = 16 ounces. 1 stone = 14 pounds = 6.35029 kg. 1 metric ton = 1,000 kg. Conversions route through kilograms as the base SI unit for consistency.

    ## Mass vs Weight

    In everyday language we say "weight" when we mean **mass**. Scientifically, weight is force (mass × gravity) measured in newtons. Kitchen scales and bathroom scales measure mass. This converter handles mass units used globally in commerce and daily life.

    ## Common Applications

    Convert body weight between kg and lbs for international health records. Convert recipe ingredients between ounces and grams. Calculate shipping weights for e-commerce. Convert gym plate weights between pound and kilogram denominations.

temperature-converter:
  steps:
    - "Enter the temperature value."
    - "Select source scale (Celsius, Fahrenheit, or Kelvin)."
    - "Select target scale."
    - "View converted value in all three scales."
  examples:
    - title: "25°C to Fahrenheit"
      description: "Room temperature conversion"
      result: "77°F"
    - title: "98.6°F to Celsius"
      description: "Body temperature"
      result: "37°C"
  intro: |
    The **Temperature Converter** converts between **Celsius (°C)**, **Fahrenheit (°F)**, and **Kelvin (K)** — the three scales used in science, medicine, cooking, and weather. Instant, accurate conversion without memorizing formulas.

    ## Conversion Formulas

    **Celsius to Fahrenheit:** °F = (°C × 9/5) + 32. **Fahrenheit to Celsius:** °C = (°F − 32) × 5/9. **Celsius to Kelvin:** K = °C + 273.15. Kelvin is an absolute scale starting at absolute zero (−273.15°C), used in physics and chemistry.

    ## Reference Points

    Water freezes at 0°C (32°F) and boils at 100°C (212°F) at sea level. Normal body temperature is approximately 37°C (98.6°F). Room temperature is roughly 20–22°C (68–72°F). Celsius and Fahrenheit intersect at −40°.

    ## Practical Uses

    Convert oven temperatures for international recipes (180°C ≈ 350°F). Interpret weather forecasts when traveling abroad. Convert laboratory measurements. Understand medical thermometers using different scales.

profit-margin-calculator:
  steps:
    - "Enter revenue (selling price or total sales)."
    - "Enter cost price (COGS or production cost)."
    - "View profit margin %, markup %, and gross profit amount."
    - "Compare against industry benchmarks in insights."
  examples:
    - title: "Sell ₹1,000 · Cost ₹700"
      description: "Retail product margin"
      result: "30% margin · 42.9% markup · ₹300 profit"
  intro: |
    The **Profit Margin Calculator** helps businesses and entrepreneurs understand profitability by calculating **gross profit margin**, **markup percentage**, and absolute profit from revenue and cost inputs. Essential for pricing strategy, financial reporting, and investor presentations.

    ## Margin vs Markup

    **Profit margin** = (Revenue − Cost) / Revenue × 100. **Markup** = (Revenue − Cost) / Cost × 100. These differ significantly: a 25% margin equals a 33.3% markup. Confusing them leads to underpricing and eroded profits.

    ## Industry Benchmarks

    Retail typically targets 25–35% gross margin. Restaurants operate on thin 3–9% net margins. SaaS companies often achieve 70–80% gross margins. Manufacturing varies widely by sector. Compare your margins to industry standards, not arbitrary targets.

    ## Improving Margins

    Reduce cost of goods through supplier negotiation or efficiency gains. Increase prices strategically where demand is inelastic. Eliminate low-margin products. Improve operational efficiency to reduce overhead. Even a 2% margin improvement can significantly impact annual profit at scale.
