      result: "600"
    - title: "What percent is 25 of 200?"
      description: "Reverse percentage lookup"
      result: "12.5%"
  intro: |
    The **Percentage Calculator** solves everyday math problems involving percentages — discounts, markups, tax calculations, grade scores, tip calculations, and financial analysis. No manual formula memorization required.

    ## Common Percentage Calculations

    **X% of Y:** Multiply Y by X/100. **What percent is X of Y?** Divide X by Y and multiply by 100. **Percentage change:** ((New − Old) / Old) × 100. **Increase by X%:** Multiply by (1 + X/100). **Decrease by X%:** Multiply by (1 − X/100).

    ## Real-World Uses

    Calculate sale discounts during shopping, determine exam scores, compute year-over-year business growth, figure tip amounts at restaurants, analyze investment returns, and convert between fractions and percentages for homework or professional reports. For fraction operations, use our [Fraction Calculator](/math/fraction-calculator/). For pricing markups, try the [Markup Calculator](/business/markup-calculator/).

    ## Tips for Accuracy

    Distinguish between **percentage points** (absolute difference) and **percent change** (relative difference). A rate moving from 10% to 15% is a 5 percentage point increase but a 50% relative increase. Always clarify which measure your context requires.
