# Copy this file to .github/workflows/pages.yml on GitHub.com (web UI).
# SourceTree OAuth cannot push workflow files without the "workflow" scope.
#
# IMPORTANT: Replace the default "jekyll-build-pages" workflow if GitHub created one.
# Use bundle exec jekyll on ubuntu-latest instead of the Docker jekyll-build-pages action.

name: Deploy Jekyll site to Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          bundler-cache: true

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Build with Jekyll
        run: |
          ruby scripts/generate_pages.rb --force
          ruby scripts/generate_search_data.rb
          ruby scripts/generate_llms_txt.rb
          bundle exec jekyll build --baseurl ""
        env:
          JEKYLL_ENV: production

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
