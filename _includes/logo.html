{% assign logo_size = include.size | default: 32 %}
{% assign logo_alt = include.alt | default: site.title | append: ' logo — free online calculators' %}
<img
  src="{{ '/assets/images/logo.png' | relative_url }}"
  alt="{{ logo_alt }}"
  class="logo-img"
  width="{{ logo_size }}"
  height="{{ logo_size }}"
  decoding="async"
  fetchpriority="{% if include.priority %}high{% else %}auto{% endif %}"
>
