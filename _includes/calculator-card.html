{% assign calc = include.calculator %}
<article class="calc-card">
  <a href="{{ calc.category | prepend: '/' | append: '/' | append: calc.slug | append: '/' | relative_url }}" class="calc-card-link">
    <div class="calc-card-icon icon-{{ calc.icon | default: 'default' }}" aria-hidden="true"></div>
    <div class="calc-card-body">
      <h3 class="calc-card-title">{{ calc.title }}</h3>
      <p class="calc-card-desc">{{ calc.description | truncate: 90 }}</p>
      <span class="calc-card-category">{{ calc.category | replace: '-', ' ' | capitalize }}</span>
    </div>
  </a>
</article>
