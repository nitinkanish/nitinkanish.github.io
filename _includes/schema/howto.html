{% assign content_data = site.data.calc_content[page.slug] %}
{% if page.formula or content_data.steps %}
<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "HowTo",
  "name": {{ page.title | append: ' — How to Use' | jsonify }},
  "description": {{ page.description | default: site.description | jsonify }},
  "image": {{ '/assets/images/og-default.png' | absolute_url | jsonify }},
  "totalTime": "PT2M",
  "step": [
    {% if content_data.steps %}
      {% for step in content_data.steps %}
      {
        "@type": "HowToStep",
        "position": {{ forloop.index }},
        "name": {{ 'Step ' | append: forloop.index | jsonify }},
        "text": {{ step | jsonify }}
      }{% unless forloop.last %},{% endunless %}
      {% endfor %}
    {% else %}
    {
      "@type": "HowToStep",
      "position": 1,
      "name": "Enter your values",
      "text": "Fill in the required input fields in the calculator form above."
    },
    {
      "@type": "HowToStep",
      "position": 2,
      "name": "View results",
      "text": "Results are calculated instantly as you type or adjust sliders."
    },
    {
      "@type": "HowToStep",
      "position": 3,
      "name": "Apply the formula",
      "text": {{ page.formula | prepend: 'Formula: ' | jsonify }}
    }
    {% endif %}
  ]
}
</script>
{% endif %}
