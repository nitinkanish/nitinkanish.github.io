{% if page.breadcrumb or page.category %}
<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "BreadcrumbList",
  "itemListElement": [
    {
      "@type": "ListItem",
      "position": 1,
      "name": "Home",
      "item": {{ site.url | jsonify }}
    }
    {% if page.category %}
    ,{
      "@type": "ListItem",
      "position": 2,
      "name": {{ page.category | replace: '-', ' ' | capitalize | jsonify }},
      "item": {{ page.category | prepend: site.url | append: '/' | jsonify }}
    }
    ,{
      "@type": "ListItem",
      "position": 3,
      "name": {{ page.title | jsonify }},
      "item": {{ page.url | absolute_url | jsonify }}
    }
    {% elsif page.layout == 'category' %}
    ,{
      "@type": "ListItem",
      "position": 2,
      "name": {{ page.title | jsonify }},
      "item": {{ page.url | absolute_url | jsonify }}
    }
    {% endif %}
  ]
}
</script>
{% endif %}
