<div id="cookie-consent" class="cookie-consent" role="dialog" aria-labelledby="cookie-consent-title" aria-describedby="cookie-consent-desc" aria-live="polite" hidden>
  <div class="cookie-consent-inner container">
    <div class="cookie-consent-content">
      <h2 id="cookie-consent-title" class="cookie-consent-title">We value your privacy</h2>
      <p id="cookie-consent-desc" class="cookie-consent-text">
        We use essential cookies for site functionality and, with your consent, analytics cookies (Google Analytics) to improve our calculators.
        Read our <a href="{{ '/cookie-policy/' | relative_url }}">Cookie Policy</a> and <a href="{{ '/privacy-policy/' | relative_url }}">Privacy Policy</a>.
      </p>
    </div>
    <div class="cookie-consent-actions">
      <button type="button" class="btn btn-secondary btn-sm" id="cookie-reject" data-cookie-action="reject">Reject</button>
      <button type="button" class="btn btn-primary btn-sm" id="cookie-accept" data-cookie-action="accept">Accept</button>
    </div>
  </div>
</div>
{% if site.google_analytics %}
<script id="ga-config" type="application/json">{"id":"{{ site.google_analytics }}"}</script>
{% endif %}
<script src="{{ '/assets/js/cookie-consent.js' | relative_url }}" defer></script>
