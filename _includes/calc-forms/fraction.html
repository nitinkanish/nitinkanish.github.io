<form id="calc-form" class="calc-form dash-form" novalidate>
  <div class="form-group">
    <label class="form-label" for="mode">Operation</label>
    <select id="mode" name="mode" class="form-select">
      <option value="add">Add (+)</option>
      <option value="subtract">Subtract (−)</option>
      <option value="multiply">Multiply (×)</option>
      <option value="divide">Divide (÷)</option>
    </select>
  </div>
  <fieldset class="form-fieldset">
    <legend class="form-label">First Fraction</legend>
    <div class="form-row">
      <div class="form-group">
        <label class="form-label" for="num1">Numerator</label>
        <input type="number" id="num1" name="num1" class="form-input" value="1" data-validate="required|number" inputmode="numeric">
      </div>
      <div class="form-group">
        <label class="form-label" for="den1">Denominator</label>
        <input type="number" id="den1" name="den1" class="form-input" value="3" data-validate="required|number|min:1" inputmode="numeric">
      </div>
    </div>
  </fieldset>
  <fieldset class="form-fieldset">
    <legend class="form-label">Second Fraction</legend>
    <div class="form-row">
      <div class="form-group">
        <label class="form-label" for="num2">Numerator</label>
        <input type="number" id="num2" name="num2" class="form-input" value="1" data-validate="required|number" inputmode="numeric">
      </div>
      <div class="form-group">
        <label class="form-label" for="den2">Denominator</label>
        <input type="number" id="den2" name="den2" class="form-input" value="4" data-validate="required|number|min:1" inputmode="numeric">
      </div>
    </div>
  </fieldset>
</form>
<div id="calc-results" class="calc-results dash-results" aria-live="polite" hidden></div>
<div id="calc-live-region" class="visually-hidden" aria-live="polite"></div>
