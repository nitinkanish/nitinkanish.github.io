<form id="calc-form" class="calc-form dash-form" novalidate>
  <div class="form-group">
    <label class="form-label" for="mode">Calculation Type</label>
    <select id="mode" name="mode" class="form-select">
      <option value="exclusive">Add GST to Amount (Exclusive)</option>
      <option value="inclusive">Remove GST from Amount (Inclusive)</option>
    </select>
  </div>

  <div class="dash-field">
    <div class="dash-field-header">
      <label class="form-label" for="amount">Amount (₹)</label>
      <span class="dash-field-value" id="amount-display">₹10,000</span>
    </div>
    <input type="range" id="amount-range" class="dash-range" min="1000" max="500000" step="1000" value="10000" aria-label="Amount slider">
    <input type="number" id="amount" name="amount" class="form-input dash-input" value="10000" min="1" data-validate="required|number|min:1" inputmode="decimal">
    <div class="dash-chips" data-target="amount">
      <button type="button" class="dash-chip" data-value="5000">₹5K</button>
      <button type="button" class="dash-chip active" data-value="10000">₹10K</button>
      <button type="button" class="dash-chip" data-value="50000">₹50K</button>
      <button type="button" class="dash-chip" data-value="100000">₹1L</button>
    </div>
  </div>

  <div class="form-group">
    <label class="form-label" for="rate">GST Rate (%)</label>
    <select id="rate" name="rate" class="form-select">
      <option value="5">5%</option>
      <option value="12">12%</option>
      <option value="18" selected>18%</option>
      <option value="28">28%</option>
    </select>
    <div class="dash-chips dash-chips--select" data-select-target="rate">
      <button type="button" class="dash-chip" data-value="5">5%</button>
      <button type="button" class="dash-chip" data-value="12">12%</button>
      <button type="button" class="dash-chip active" data-value="18">18%</button>
      <button type="button" class="dash-chip" data-value="28">28%</button>
    </div>
  </div>
</form>
<div id="calc-results" class="calc-results dash-results" aria-live="polite" hidden></div>
<div id="calc-live-region" class="visually-hidden" aria-live="polite"></div>
