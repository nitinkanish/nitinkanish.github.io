<div class="scientific-calc">
  <div class="calc-mode">
    <button type="button" class="active" data-mode="deg">DEG</button>
    <button type="button" data-mode="rad">RAD</button>
  </div>
  <div class="calc-display">
    <div class="display-expression" id="sci-expression"></div>
    <div class="display-value" id="sci-display">0</div>
  </div>
  <div class="calc-buttons">
    <button type="button" class="calc-btn operator" data-action="func" data-value="sin">sin</button>
    <button type="button" class="calc-btn operator" data-action="func" data-value="cos">cos</button>
    <button type="button" class="calc-btn operator" data-action="func" data-value="tan">tan</button>
    <button type="button" class="calc-btn operator" data-action="func" data-value="log">log</button>
    <button type="button" class="calc-btn operator" data-action="func" data-value="ln">ln</button>
    <button type="button" class="calc-btn operator" data-action="func" data-value="sqrt">√</button>
    <button type="button" class="calc-btn operator" data-action="func" data-value="square">x²</button>
    <button type="button" class="calc-btn operator" data-action="clear" data-value="C">C</button>
    <button type="button" class="calc-btn" data-action="digit" data-value="7">7</button>
    <button type="button" class="calc-btn" data-action="digit" data-value="8">8</button>
    <button type="button" class="calc-btn" data-action="digit" data-value="9">9</button>
    <button type="button" class="calc-btn operator" data-action="operator" data-value="/">÷</button>
    <button type="button" class="calc-btn" data-action="digit" data-value="4">4</button>
    <button type="button" class="calc-btn" data-action="digit" data-value="5">5</button>
    <button type="button" class="calc-btn" data-action="digit" data-value="6">6</button>
    <button type="button" class="calc-btn operator" data-action="operator" data-value="*">×</button>
    <button type="button" class="calc-btn" data-action="digit" data-value="1">1</button>
    <button type="button" class="calc-btn" data-action="digit" data-value="2">2</button>
    <button type="button" class="calc-btn" data-action="digit" data-value="3">3</button>
    <button type="button" class="calc-btn operator" data-action="operator" data-value="-">−</button>
    <button type="button" class="calc-btn" data-action="digit" data-value="0">0</button>
    <button type="button" class="calc-btn" data-action="digit" data-value=".">.</button>
    <button type="button" class="calc-btn operator" data-action="func" data-value="neg">±</button>
    <button type="button" class="calc-btn operator" data-action="operator" data-value="+">+</button>
    <button type="button" class="calc-btn operator wide" data-action="const" data-value="pi">π</button>
    <button type="button" class="calc-btn equals wide" data-action="equals" data-value="=">=</button>
  </div>
</div>
