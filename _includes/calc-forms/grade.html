<form id="calc-form" class="calc-form dash-form" novalidate>
  <div class="form-row">
    <div class="form-group">
      <label class="form-label" for="score1">Assignment 1 Score (%)</label>
      <input type="number" id="score1" name="score1" class="form-input" value="85" min="0" max="100" inputmode="decimal">
    </div>
    <div class="form-group">
      <label class="form-label" for="weight1">Weight (%)</label>
      <input type="number" id="weight1" name="weight1" class="form-input" value="20" min="0" max="100" inputmode="decimal">
    </div>
  </div>
  <div class="form-row">
    <div class="form-group">
      <label class="form-label" for="score2">Assignment 2 Score (%)</label>
      <input type="number" id="score2" name="score2" class="form-input" value="92" min="0" max="100" inputmode="decimal">
    </div>
    <div class="form-group">
      <label class="form-label" for="weight2">Weight (%)</label>
      <input type="number" id="weight2" name="weight2" class="form-input" value="25" min="0" max="100" inputmode="decimal">
    </div>
  </div>
  <div class="form-row">
    <div class="form-group">
      <label class="form-label" for="score3">Midterm Score (%)</label>
      <input type="number" id="score3" name="score3" class="form-input" value="78" min="0" max="100" inputmode="decimal">
    </div>
    <div class="form-group">
      <label class="form-label" for="weight3">Weight (%)</label>
      <input type="number" id="weight3" name="weight3" class="form-input" value="30" min="0" max="100" inputmode="decimal">
    </div>
  </div>
  <div class="form-row">
    <div class="form-group">
      <label class="form-label" for="score4">Final Exam Score (%)</label>
      <input type="number" id="score4" name="score4" class="form-input" value="88" min="0" max="100" inputmode="decimal">
    </div>
    <div class="form-group">
      <label class="form-label" for="weight4">Weight (%)</label>
      <input type="number" id="weight4" name="weight4" class="form-input" value="25" min="0" max="100" inputmode="decimal">
    </div>
  </div>
</form>
<div id="calc-results" class="calc-results dash-results" aria-live="polite" hidden></div>
