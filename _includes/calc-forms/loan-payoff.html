<form id="calc-form" class="calc-form dash-form" novalidate>
  <div class="dash-field">
    <div class="dash-field-header">
      <label class="form-label" for="principal">Loan Amount (₹)</label>
      <span class="dash-field-value" id="principal-display">₹10,00,000</span>
    </div>
    <input type="range" id="principal-range" class="dash-range" min="100000" max="10000000" step="50000" value="1000000" aria-label="Loan amount">
    <input type="number" id="principal" name="principal" class="form-input dash-input" value="1000000" min="1" data-validate="required|number|min:1" inputmode="decimal">
  </div>
  <div class="form-row">
    <div class="form-group">
      <label class="form-label" for="rate">Interest Rate (% p.a.)</label>
      <input type="number" id="rate" name="rate" class="form-input" value="8.5" min="0.1" step="0.1" data-validate="required|number" inputmode="decimal">
    </div>
    <div class="form-group">
      <label class="form-label" for="tenure">Tenure (months)</label>
      <input type="number" id="tenure" name="tenure" class="form-input" value="240" min="1" data-validate="required|number|min:1" inputmode="numeric">
    </div>
  </div>
  <div class="dash-field">
    <div class="dash-field-header">
      <label class="form-label" for="extra">Extra Monthly Payment (₹)</label>
      <span class="dash-field-value" id="extra-display">₹5,000</span>
    </div>
    <input type="range" id="extra-range" class="dash-range" min="0" max="50000" step="500" value="5000" aria-label="Extra payment">
    <input type="number" id="extra" name="extra" class="form-input dash-input" value="5000" min="0" data-validate="number|min:0" inputmode="decimal">
  </div>
</form>
<div id="calc-results" class="calc-results dash-results" aria-live="polite" hidden></div>
