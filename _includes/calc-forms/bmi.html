<form id="calc-form" class="calc-form" novalidate>
  <div class="form-group">
    <label class="form-label" for="unit">Unit System</label>
    <select id="unit" name="unit" class="form-select">
      <option value="metric" selected>Metric (kg, cm)</option>
      <option value="imperial">Imperial (lbs, inches)</option>
    </select>
  </div>
  <div class="form-row">
    <div class="form-group">
      <label class="form-label" for="weight">Weight</label>
      <input type="number" id="weight" name="weight" class="form-input" value="70" min="1" data-validate="required|number|min:1" inputmode="decimal">
    </div>
    <div class="form-group">
      <label class="form-label" for="height">Height</label>
      <input type="number" id="height" name="height" class="form-input" value="170" min="1" data-validate="required|number|min:1" inputmode="decimal">
    </div>
  </div>
</form>
<div id="calc-results" class="calc-results" aria-live="polite"></div>
<div id="calc-live-region" class="visually-hidden" aria-live="polite"></div>
