<form id="calc-form" class="calc-form dash-form" novalidate>
  <div class="form-row">
    <div class="form-group">
      <label class="form-label" for="name1">Your Name</label>
      <input type="text" id="name1" name="name1" class="form-input" value="Alex" data-validate="required" maxlength="40" autocomplete="name">
    </div>
    <div class="form-group">
      <label class="form-label" for="name2">Partner / Crush Name</label>
      <input type="text" id="name2" name="name2" class="form-input" value="Priya" data-validate="required" maxlength="40" autocomplete="off">
    </div>
  </div>
  <p class="form-hint">Fun result only. Not scientific relationship advice.</p>
</form>
<div id="calc-results" class="calc-results dash-results" aria-live="polite" hidden></div>
<div id="calc-live-region" class="visually-hidden" aria-live="polite"></div>
