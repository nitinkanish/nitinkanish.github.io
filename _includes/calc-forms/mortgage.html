<form id="calc-form" class="calc-form dash-form" novalidate>
  <div class="dash-field">
    <div class="dash-field-header">
      <label class="form-label" for="principal">Loan Amount ($)</label>
      <span class="dash-field-value" id="principal-display">$350,000</span>
    </div>
    <input type="range" id="principal-range" class="dash-range" min="50000" max="2000000" step="5000" value="350000" aria-label="Loan amount slider">
    <input type="number" id="principal" name="principal" class="form-input dash-input" value="350000" min="1" data-validate="required|number|min:1" inputmode="decimal">
    <div class="dash-chips" data-target="principal">
      <button type="button" class="dash-chip" data-value="250000">$250K</button>
      <button type="button" class="dash-chip active" data-value="350000">$350K</button>
      <button type="button" class="dash-chip" data-value="500000">$500K</button>
      <button type="button" class="dash-chip" data-value="750000">$750K</button>
    </div>
  </div>

  <div class="dash-field">
    <div class="dash-field-header">
      <label class="form-label" for="rate">Interest Rate (% p.a.)</label>
      <span class="dash-field-value" id="rate-display">6.5%</span>
    </div>
    <input type="range" id="rate-range" class="dash-range" min="3" max="12" step="0.125" value="6.5" aria-label="Interest rate slider">
    <input type="number" id="rate" name="rate" class="form-input dash-input" value="6.5" min="0.1" step="0.125" data-validate="required|number|min:0.1" inputmode="decimal">
    <div class="dash-chips" data-target="rate">
      <button type="button" class="dash-chip" data-value="5.5">5.5%</button>
      <button type="button" class="dash-chip active" data-value="6.5">6.5%</button>
      <button type="button" class="dash-chip" data-value="7.5">7.5%</button>
      <button type="button" class="dash-chip" data-value="8.5">8.5%</button>
    </div>
  </div>

  <div class="dash-field">
    <div class="dash-field-header">
      <label class="form-label" for="tenure">Loan Term (months)</label>
      <span class="dash-field-value" id="tenure-display">360 mo</span>
    </div>
    <input type="range" id="tenure-range" class="dash-range" min="60" max="360" step="12" value="360" aria-label="Loan term slider">
    <input type="number" id="tenure" name="tenure" class="form-input dash-input" value="360" min="1" data-validate="required|number|min:1" inputmode="numeric">
    <div class="dash-chips" data-target="tenure">
      <button type="button" class="dash-chip" data-value="180">15 yr</button>
      <button type="button" class="dash-chip" data-value="240">20 yr</button>
      <button type="button" class="dash-chip" data-value="300">25 yr</button>
      <button type="button" class="dash-chip active" data-value="360">30 yr</button>
    </div>
  </div>
</form>
<div id="calc-results" class="calc-results dash-results" aria-live="polite" hidden></div>
<div id="calc-live-region" class="visually-hidden" aria-live="polite"></div>
