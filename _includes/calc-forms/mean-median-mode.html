<form id="calc-form" class="calc-form dash-form" novalidate>
  <div class="form-group">
    <label class="form-label" for="dataset">Enter Numbers</label>
    <textarea id="dataset" name="dataset" class="form-input" rows="4" data-validate="required">12, 15, 18, 22, 22, 25, 30, 20</textarea>
    <p class="form-hint">Separate values with commas, spaces, or new lines</p>
  </div>
</form>
<div id="calc-results" class="calc-results dash-results" aria-live="polite" hidden></div>
