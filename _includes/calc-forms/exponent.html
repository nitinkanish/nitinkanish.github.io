<form id="calc-form" class="calc-form dash-form" novalidate>
  <div class="form-row">
    <div class="form-group">
      <label class="form-label" for="base">Base</label>
      <input type="number" id="base" name="base" class="form-input" value="2" data-validate="required|number" inputmode="decimal" step="any">
    </div>
    <div class="form-group">
      <label class="form-label" for="exponent">Exponent</label>
      <input type="number" id="exponent" name="exponent" class="form-input" value="10" data-validate="required|number" inputmode="decimal" step="any">
    </div>
  </div>
</form>
<div id="calc-results" class="calc-results dash-results" aria-live="polite" hidden></div>
<div id="calc-live-region" class="visually-hidden" aria-live="polite"></div>
