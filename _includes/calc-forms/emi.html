<form id="calc-form" class="calc-form" novalidate>
  <div class="form-row">
    <div class="form-group">
      <label class="form-label" for="principal">Loan Amount (₹)</label>
      <input type="number" id="principal" name="principal" class="form-input" value="1000000" min="1" data-validate="required|number|min:1" inputmode="decimal">
    </div>
    <div class="form-group">
      <label class="form-label" for="rate">Annual Interest Rate (%)</label>
      <input type="number" id="rate" name="rate" class="form-input" value="8.5" min="0.1" step="0.1" data-validate="required|number|min:0.1" inputmode="decimal">
    </div>
  </div>
  <div class="form-group">
    <label class="form-label" for="tenure">Loan Tenure (months)</label>
    <input type="number" id="tenure" name="tenure" class="form-input" value="240" min="1" data-validate="required|number|min:1" inputmode="numeric">
  </div>
</form>
<div id="calc-results" class="calc-results" aria-live="polite"></div>
<div id="calc-live-region" class="visually-hidden" aria-live="polite"></div>
