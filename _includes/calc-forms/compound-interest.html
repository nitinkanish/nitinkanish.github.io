<form id="calc-form" class="calc-form" novalidate>
  <div class="form-row">
    <div class="form-group">
      <label class="form-label" for="principal">Initial Principal (₹)</label>
      <input type="number" id="principal" name="principal" class="form-input" value="100000" min="0" data-validate="required|number" inputmode="decimal">
    </div>
    <div class="form-group">
      <label class="form-label" for="monthly">Monthly Contribution (₹)</label>
      <input type="number" id="monthly" name="monthly" class="form-input" value="5000" min="0" data-validate="number" inputmode="decimal">
    </div>
  </div>
  <div class="form-row">
    <div class="form-group">
      <label class="form-label" for="rate">Annual Rate (%)</label>
      <input type="number" id="rate" name="rate" class="form-input" value="10" min="0.1" data-validate="required|number|min:0.1" inputmode="decimal">
    </div>
    <div class="form-group">
      <label class="form-label" for="years">Time Period (years)</label>
      <input type="number" id="years" name="years" class="form-input" value="10" min="1" data-validate="required|number|min:1" inputmode="numeric">
    </div>
  </div>
  <div class="form-group">
    <label class="form-label" for="compound">Compounding Frequency</label>
    <select id="compound" name="compound" class="form-select">
      <option value="1">Annually</option>
      <option value="4">Quarterly</option>
      <option value="12" selected>Monthly</option>
      <option value="365">Daily</option>
    </select>
  </div>
</form>
<div id="calc-results" class="calc-results" aria-live="polite"></div>
<div id="calc-live-region" class="visually-hidden" aria-live="polite"></div>
