<form id="calc-form" class="calc-form" novalidate>
  <div class="converter-grid">
    <div class="form-group">
      <label class="form-label" for="from_value">From</label>
      <input type="number" id="from_value" name="from_value" class="form-input" value="25" data-validate="required|number" inputmode="decimal">
      <select name="from_unit" class="form-select" style="margin-top:0.5rem">
        <option value="c" selected>Celsius (°C)</option>
        <option value="f">Fahrenheit (°F)</option>
        <option value="k">Kelvin (K)</option>
      </select>
    </div>
    <div class="converter-swap">
      <button type="button" class="swap-btn" aria-label="Swap units">⇄</button>
    </div>
    <div class="form-group">
      <label class="form-label" for="to_value">To</label>
      <input type="number" id="to_value" name="to_value" class="form-input" readonly>
      <select name="to_unit" class="form-select" style="margin-top:0.5rem">
        <option value="f" selected>Fahrenheit (°F)</option>
        <option value="c">Celsius (°C)</option>
        <option value="k">Kelvin (K)</option>
      </select>
    </div>
  </div>
</form>
<div id="calc-results" class="calc-results" aria-live="polite"></div>
