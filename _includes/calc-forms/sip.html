<form id="calc-form" class="calc-form" novalidate>
  <div class="form-row">
    <div class="form-group">
      <label class="form-label" for="monthly">Monthly Investment (₹)</label>
      <input type="number" id="monthly" name="monthly" class="form-input" value="5000" min="100" data-validate="required|number|min:100" inputmode="decimal">
    </div>
    <div class="form-group">
      <label class="form-label" for="return">Expected Return (% p.a.)</label>
      <input type="number" id="return" name="return" class="form-input" value="12" min="1" step="0.5" data-validate="required|number|min:1" inputmode="decimal">
    </div>
  </div>
  <div class="form-group">
    <label class="form-label" for="years">Investment Period (years)</label>
    <input type="number" id="years" name="years" class="form-input" value="10" min="1" data-validate="required|number|min:1" inputmode="numeric">
  </div>
</form>
<div id="calc-results" class="calc-results" aria-live="polite"></div>
<div id="calc-live-region" class="visually-hidden" aria-live="polite"></div>
