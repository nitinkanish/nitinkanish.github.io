<form id="calc-form" class="calc-form" novalidate>
  <div class="form-group">
    <label class="form-label" for="mode">Calculation Type</label>
    <select id="mode" name="mode" class="form-select">
      <option value="of">X% of Y</option>
      <option value="what">X is what % of Y</option>
      <option value="change">% Change (from X to Y)</option>
      <option value="increase">Increase X by Y%</option>
      <option value="decrease">Decrease X by Y%</option>
    </select>
  </div>
  <div class="form-row">
    <div class="form-group">
      <label class="form-label" for="value1">Value 1</label>
      <input type="number" id="value1" name="value1" class="form-input" value="20" data-validate="required|number" inputmode="decimal">
    </div>
    <div class="form-group">
      <label class="form-label" for="value2">Value 2</label>
      <input type="number" id="value2" name="value2" class="form-input" value="500" data-validate="required|number" inputmode="decimal">
    </div>
  </div>
</form>
<div id="calc-results" class="calc-results" aria-live="polite"></div>
<div id="calc-live-region" class="visually-hidden" aria-live="polite"></div>
