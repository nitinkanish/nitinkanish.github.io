<form id="calc-form" class="calc-form dash-form" novalidate>
  <div class="form-row">
    <div class="form-group">
      <label class="form-label" for="birthdate">Date of Birth</label>
      <input type="date" id="birthdate" name="birthdate" class="form-input" value="1990-01-15" data-validate="required|date">
    </div>
    <div class="form-group">
      <label class="form-label" for="enddate">Calculate Age On (optional)</label>
      <input type="date" id="enddate" name="enddate" class="form-input" data-validate="date">
      <p class="form-hint">Leave blank for today's date</p>
    </div>
  </div>
</form>
<div id="calc-results" class="calc-results dash-results" aria-live="polite" hidden></div>
<div id="calc-live-region" class="visually-hidden" aria-live="polite"></div>
