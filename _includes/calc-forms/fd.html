<form id="calc-form" class="calc-form" novalidate>
  <div class="form-row">
    <div class="form-group">
      <label class="form-label" for="principal">Deposit Amount (₹)</label>
      <input type="number" id="principal" name="principal" class="form-input" value="100000" min="1000" data-validate="required|number|min:1000" inputmode="decimal">
    </div>
    <div class="form-group">
      <label class="form-label" for="rate">Interest Rate (% p.a.)</label>
      <input type="number" id="rate" name="rate" class="form-input" value="7" min="1" step="0.1" data-validate="required|number|min:1" inputmode="decimal">
    </div>
  </div>
  <div class="form-row">
    <div class="form-group">
      <label class="form-label" for="years">Tenure (years)</label>
      <input type="number" id="years" name="years" class="form-input" value="5" min="1" data-validate="required|number|min:1" inputmode="numeric">
    </div>
    <div class="form-group">
      <label class="form-label" for="compound">Compounding</label>
      <select id="compound" name="compound" class="form-select">
        <option value="1">Annually</option>
        <option value="2">Half-Yearly</option>
        <option value="4" selected>Quarterly</option>
        <option value="12">Monthly</option>
      </select>
    </div>
  </div>
</form>
<div id="calc-results" class="calc-results" aria-live="polite"></div>
<div id="calc-live-region" class="visually-hidden" aria-live="polite"></div>
