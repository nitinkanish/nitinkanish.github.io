<form id="calc-form" class="calc-form dash-form" novalidate>
  <div class="dash-field">
    <div class="dash-field-header">
      <label class="form-label" for="principal">Deposit Amount (₹)</label>
      <span class="dash-field-value" id="principal-display">₹1,00,000</span>
    </div>
    <input type="range" id="principal-range" class="dash-range" min="10000" max="5000000" step="10000" value="100000" aria-label="Deposit amount slider">
    <input type="number" id="principal" name="principal" class="form-input dash-input" value="100000" min="1000" data-validate="required|number|min:1000" inputmode="decimal">
    <div class="dash-chips" data-target="principal">
      <button type="button" class="dash-chip" data-value="50000">₹50K</button>
      <button type="button" class="dash-chip active" data-value="100000">₹1L</button>
      <button type="button" class="dash-chip" data-value="500000">₹5L</button>
      <button type="button" class="dash-chip" data-value="1000000">₹10L</button>
    </div>
  </div>

  <div class="dash-field">
    <div class="dash-field-header">
      <label class="form-label" for="rate">Interest Rate (% p.a.)</label>
      <span class="dash-field-value" id="rate-display">7%</span>
    </div>
    <input type="range" id="rate-range" class="dash-range" min="3" max="10" step="0.1" value="7" aria-label="Interest rate slider">
    <input type="number" id="rate" name="rate" class="form-input dash-input" value="7" min="1" step="0.1" data-validate="required|number|min:1" inputmode="decimal">
    <div class="dash-chips" data-target="rate">
      <button type="button" class="dash-chip" data-value="6">6%</button>
      <button type="button" class="dash-chip active" data-value="7">7%</button>
      <button type="button" class="dash-chip" data-value="7.5">7.5%</button>
      <button type="button" class="dash-chip" data-value="8">8%</button>
    </div>
  </div>

  <div class="form-row dash-form-row">
    <div class="dash-field">
      <div class="dash-field-header">
        <label class="form-label" for="years">Tenure (years)</label>
        <span class="dash-field-value" id="years-display">5 yrs</span>
      </div>
      <input type="range" id="years-range" class="dash-range" min="1" max="10" step="1" value="5" aria-label="Tenure slider">
      <input type="number" id="years" name="years" class="form-input dash-input" value="5" min="1" data-validate="required|number|min:1" inputmode="numeric">
    </div>
    <div class="form-group">
      <label class="form-label" for="compound">Compounding</label>
      <select id="compound" name="compound" class="form-select">
        <option value="1">Annually</option>
        <option value="2">Half-Yearly</option>
        <option value="4" selected>Quarterly</option>
        <option value="12">Monthly</option>
      </select>
    </div>
  </div>
</form>
<div id="calc-results" class="calc-results dash-results" aria-live="polite" hidden></div>
<div id="calc-live-region" class="visually-hidden" aria-live="polite"></div>
