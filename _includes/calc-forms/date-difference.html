<form id="calc-form" class="calc-form dash-form" novalidate>
  <div class="form-row">
    <div class="form-group">
      <label class="form-label" for="start_date">Start Date</label>
      <input type="date" id="start_date" name="start_date" class="form-input" value="2025-01-01" data-validate="required|date">
    </div>
    <div class="form-group">
      <label class="form-label" for="end_date">End Date</label>
      <input type="date" id="end_date" name="end_date" class="form-input" data-validate="date">
      <p class="form-hint">Leave blank for today</p>
    </div>
  </div>
  <div class="form-group">
    <label class="form-label">
      <input type="checkbox" id="inclusive" name="inclusive" value="1"> Include end date (+1 day)
    </label>
  </div>
</form>
<div id="calc-results" class="calc-results dash-results" aria-live="polite" hidden></div>
<div id="calc-live-region" class="visually-hidden" aria-live="polite"></div>
